name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write # för release-steget vid taggar; övriga körningar läser bara

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build sidecar
        run: dotnet build sidecar -c Release

      # prepack kör dotnet publish till dist/, så tarballen är komplett
      - name: Pack sidecar npm package
        working-directory: sidecar-npm
        run: npm pack

      - name: Build extension
        working-directory: extension
        run: |
          npm ci
          npm run compile

      - name: Package VSIX
        working-directory: extension
        run: npx -y @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: tsql-debugger-vsix
          path: extension/*.vsix
          if-no-files-found: error

      - name: Upload sidecar npm package
        uses: actions/upload-artifact@v4
        with:
          name: tsql-debugger-sidecar-npm
          path: sidecar-npm/*.tgz
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            extension/*.vsix sidecar-npm/*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes
