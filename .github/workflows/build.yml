name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write # för release-steget vid taggar; övriga körningar läser bara

jobs:
  # Enhetstester (analysatorn) + integrationstester av pausmekaniken mot en
  # riktig SQL Server. Det enda som verifierar runtime-beteendet
  # (Pause/abort/exception-stopp/modulläge) automatiskt.
  test:
    runs-on: ubuntu-latest
    # A hung test must fail in bounded time, not sit on a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Started here rather than as a `services:` container on purpose: the
      # runner tears a service container down after the last step and dumps
      # SQL Server's entire startup log while doing it, which pushes the actual
      # test failure off the end of the job log. Nothing waits for the server
      # here - the test fixture already retries its first connection for two
      # minutes, which is what a service container's health check bought us.
      - name: Start SQL Server
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=Sqldbgr!Test123' -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Run tests
        env:
          SQLDBGR_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Sqldbgr!Test123;TrustServerCertificate=true;Connect Timeout=10"
        # --blame-hang turns a hang into a named failure: if no test completes
        # within the timeout the run aborts and reports which test was running,
        # instead of the job sitting there until the runner gives up.
        run: >-
          dotnet test tests/SqlDebugger.Sidecar.Tests
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts
          --blame-hang --blame-hang-timeout 4m

      # The integration tests skip themselves when SQLDBGR_TEST_CONNECTION is
      # missing, and a skipped test is green - so losing the server or the env
      # var would turn the half of the suite that touches a real one into a
      # silent no-op that still passes.
      - name: Require every test to have run
        run: |
          trx=$(ls artifacts/*.trx | head -1)
          counters=$(grep -o '<Counters[^/]*/>' "$trx")
          echo "$counters"
          total=$(sed -n 's/.*[^a-zA-Z]total="\([0-9]*\)".*/\1/p' <<<"$counters")
          skipped=$(sed -n 's/.*notExecuted="\([0-9]*\)".*/\1/p' <<<"$counters")
          if [ "${total:-0}" -lt 48 ]; then
            echo "::error::only ${total:-0} tests ran; the suite has at least 48"
            exit 1
          fi
          if [ "${skipped:-1}" -ne 0 ]; then
            echo "::error::${skipped} test(s) were skipped - the integration tests must run"
            exit 1
          fi

      # Last, so the failure is the last thing in the job log.
      - name: Report failed tests
        if: failure()
        run: python3 scripts/report-failed-tests.py "artifacts/*.trx"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Patch räknas upp per bygge (major.minor från package.json + run_number)
      # så varje VSIX går att särskilja; vid v*-taggar gäller taggens version.
      - name: Compute build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./extension/package.json').version.split('.').slice(0,2).join('.')")
            echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        run: |
          (cd extension && npm version --no-git-tag-version "${{ steps.version.outputs.version }}")
          (cd sidecar-npm && npm version --no-git-tag-version "${{ steps.version.outputs.version }}")

      - name: Build sidecar
        run: dotnet build sidecar -c Release

      # Valideras på varje push men laddas bara upp vid release (taggar) -
      # sidecaren buntas numera i VSIX:en, så tarballen behövs bara för
      # npm-publicering/fristående körning. prepack kör dotnet publish.
      - name: Pack sidecar npm package
        working-directory: sidecar-npm
        run: npm pack

      - name: Build and unit-test extension
        working-directory: extension
        run: |
          npm ci
          npm test

      # Sidecaren buntas in i VSIX:en; extensionen hämtar .NET-runtimen
      # själv via ms-dotnettools.vscode-dotnet-runtime vid första körningen
      - name: Bundle sidecar into extension
        run: dotnet publish sidecar -c Release -o extension/sidecar-dist -p:Version="${{ steps.version.outputs.version }}"

      - name: Package VSIX
        working-directory: extension
        run: npx -y @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: sqldbgr-vsix-${{ steps.version.outputs.version }}
          path: extension/*.vsix
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            extension/*.vsix sidecar-npm/*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Trusted publishing: GitHub's OIDC token is exchanged directly for a
  # Marketplace credential. No Personal Access Token (Azure DevOps retires
  # global PATs on 2026-12-01), and no Entra app registration, federated
  # credential or Azure DevOps user either - the parts that turned out to be
  # unworkable for a publisher owned by a personal Microsoft account.
  #
  # It needs a trusted publishing policy for this repository and workflow on
  # the Marketplace publisher page. Setup is in README.md.
  #
  # Pinned to a prerelease on purpose: --oidc is implemented but unannounced,
  # and PR #1297 hides it from `vsce publish --help`, so `latest` (3.9.2) does
  # not have it at all. Move to `latest` once 3.9.3 ships.
  publish:
    needs: build
    # Off until the Marketplace ships the exchange endpoint: today
    # POST /_apis/gallery/token answers 404 "The controller for path
    # '/_apis/gallery/token' was not found", so a tag would fail here every
    # time while the VSIX and the GitHub release succeeded. Run the "Check
    # trusted publishing" workflow to see whether that is still true, then set
    # the repository variable TRUSTED_PUBLISHING to true to turn this on.
    if: startsWith(github.ref, 'refs/tags/v') && vars.TRUSTED_PUBLISHING == 'true' 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token - nothing long-lived is stored here
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sqldbgr-vsix-*
          merge-multiple: true
          path: vsix

      - name: Publish to the VS Code Marketplace
        run: npx -y @vscode/vsce@3.9.3-12 publish --oidc --packagePath vsix/*.vsix
