name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write # för release-steget vid taggar; övriga körningar läser bara

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Patch räknas upp per bygge (major.minor från package.json + run_number)
      # så varje VSIX går att särskilja; vid v*-taggar gäller taggens version.
      - name: Compute build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./extension/package.json').version.split('.').slice(0,2).join('.')")
            echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        run: |
          (cd extension && npm version --no-git-tag-version "${{ steps.version.outputs.version }}")
          (cd sidecar-npm && npm version --no-git-tag-version "${{ steps.version.outputs.version }}")

      - name: Build sidecar
        run: dotnet build sidecar -c Release

      # Valideras på varje push men laddas bara upp vid release (taggar) -
      # sidecaren buntas numera i VSIX:en, så tarballen behövs bara för
      # npm-publicering/fristående körning. prepack kör dotnet publish.
      - name: Pack sidecar npm package
        working-directory: sidecar-npm
        run: npm pack

      - name: Build extension
        working-directory: extension
        run: |
          npm ci
          npm run compile

      # Sidecaren buntas in i VSIX:en; extensionen hämtar .NET-runtimen
      # själv via ms-dotnettools.vscode-dotnet-runtime vid första körningen
      - name: Bundle sidecar into extension
        run: dotnet publish sidecar -c Release -o extension/sidecar-dist -p:Version="${{ steps.version.outputs.version }}"

      - name: Package VSIX
        working-directory: extension
        run: npx -y @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: sqldbgr-vsix-${{ steps.version.outputs.version }}
          path: extension/*.vsix
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            extension/*.vsix sidecar-npm/*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes
