# Prints the claims GitHub actually puts in the OIDC token, so a trusted
# publishing policy can be filled in from fact rather than from guesswork.
#
# The audience is the Marketplace's, matching what `vsce publish --oidc` asks
# for. workflow_ref and job_workflow_ref are what a policy pins - a policy that
# differs by one character never matches, and the only symptom is a failed
# token exchange at release time, long after the mistake was made.
#
# Run from Actions -> "Show the OIDC subject" -> Run workflow.
name: Show the OIDC subject

on:
  workflow_dispatch:

jobs:
  subject:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Print the claims Azure matches on
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('marketplace.visualstudio.com');
            // Only the claims that matter are printed - never the token, which
            // is a credential in its own right.
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            for (const key of ['sub', 'repository', 'repository_id',
                               'repository_owner', 'repository_owner_id',
                               'workflow_ref', 'job_workflow_ref',
                               'environment', 'iss', 'aud']) {
              core.info(`${key.padEnd(22)} ${claims[key] ?? '(absent)'}`);
            }
            core.notice(`Subject: ${claims.sub}`);
